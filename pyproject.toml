[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-corporate-governance"
version = "0.1.0"
description = "F30 standalone multi-agent corporate governance reference system"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mahsa Keikha"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
